<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
</head>

<body>

<div class="container">
    <h1>Index - Simple Calculator</h1>

    <label>First Number (Integer)</label>
    <input type="number" id="num1" value="45">

    <label>Second Number (Integer)</label>
    <input type="number" id="num2" value="12">

    <div class="buttons">
        <button class="add" onclick="add()">Add</button>
        <button class="sub" onclick="subtract()">Subtract</button>
        <button class="mul" onclick="multiply()">Multiply</button>
        <button class="div" onclick="divide()">Division</button>
    </div>

    <div class="result-box">
        <h3>Calculated Result</h3>
        <p id="result"></p>
    </div>
</div>
</body>
</html>
