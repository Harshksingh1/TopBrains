<div class="orders-container">
  <h2>Orders List</h2>
  
  <table class="orders-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Price</th>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ order.product }}</td>
        <td>{{ order.price | currency:'INR' }}</td>
        <td>{{ order.date | date:'medium' }}</td>
        <td>{{ order.status | orderStatus }}</td>
      </tr>
    </tbody>
  </table>
</div>
